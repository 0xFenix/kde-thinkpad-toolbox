# Tuning for thinkpad-fan-hold (the daemon that keeps a pinned fan level).
# Installed to /etc/thinkpad-fan-hold.conf. Lines are KEY=VALUE; anything else
# is ignored. Environment variables THINKPAD_FAN_INTERVAL / THINKPAD_FAN_TCRIT
# override these values.

# Seconds between level checks. Must be an integer >= 1.
#INTERVAL=1

# Safety net (°C): a pinned level is released back to automatic mode if the CPU
# package exceeds this. 0 disables the net (not advised for low levels —
# a pinned "level 0" means no airflow at all). Ignored for levels 6, 7 and
# full-speed, which move more air than automatic mode anyway.
#TCRIT=90
